services:
  postgres:
    image: postgres:16-alpine
    container_name: nest_pet_store_pr8_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nest_user
      POSTGRES_PASSWORD: nest_password
      POSTGRES_DB: store_pr8_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_pr8:/var/lib/postgresql/data

volumes:
  pgdata_pr8:
